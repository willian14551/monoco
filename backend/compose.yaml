services:
  banco:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: monoco
      MYSQL_USER: monoco
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configure DB_ROOT_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - dados_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    build: .
    depends_on:
      banco:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://banco:3306/monoco?serverTimezone=UTC&characterEncoding=UTF-8
      DB_USER: monoco
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Configure ENCRYPTION_KEY no arquivo .env}
      DEMO_PERMITIDA: ${DEMO_PERMITIDA:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
volumes:
  dados_mysql:
