server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
spring:
  profiles:
    default: local
  application:
    name: monoco-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      enabled: false
monoco:
  jwt-secret: ${JWT_SECRET:}
  encryption-key: ${ENCRYPTION_KEY:}
  demo-permitida: ${DEMO_PERMITIDA:false}
  cors-origens: ${CORS_ORIGINS:http://localhost:8080,http://localhost:5173}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    use-root-path: true
logging:
  file:
    name: ./logs/monoco.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 70MB
  level:
    br.com.monoco: INFO
